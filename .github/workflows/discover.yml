name: discover-chats
on:
  push:
    paths: ["ops/discover"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot/discover.py
        env:
          TG_AF_TOKEN: ${{ secrets.TG_AF_TOKEN }}
      - run: |
          git config user.name "PlayMax Bot"; git config user.email "playmax.uzb@gmail.com"
          git add data/chats.json data/debug.txt && git commit -m "ops: chats discovered" && git push || true
